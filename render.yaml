services:
  - type: web
    name: jinju-water-check
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/kma/status
    envVars:
      - key: KMA_SERVICE_KEY
        sync: false
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
